# Supabase CLI config untuk WargaKu.
# Bagian [auth] dikirim ke project dengan `supabase config push`.
# Setelah deploy ke Vercel, ganti site_url dan tambahkan URL produksi ke additional_redirect_urls.
project_id = "wargaku"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
enabled = true
site_url = "https://wargaku-sooty.vercel.app"
additional_redirect_urls = ["https://wargaku-sooty.vercel.app/atur-sandi", "http://localhost:5173/atur-sandi"]
jwt_expiry = 3600
# Akun hanya dibuat lewat undangan pengurus (Edge Function invite-user).
enable_signup = false

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.email]
# true = penyedia login email aktif. Pendaftaran mandiri tetap mati lewat [auth] enable_signup = false.
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
max_frequency = "1m0s"
otp_length = 8

# Email "Atur kata sandi" dipakai untuk akun baru (dari invite-user) dan Lupa kata sandi.
# Template kustom hanya bisa dipasang setelah SMTP sendiri dikonfigurasi (batasan paket gratis).
# Setelah SMTP aktif, hapus tanda komentar tiga baris di bawah lalu jalankan `supabase config push`.
# [auth.email.template.recovery]
# subject = "Atur kata sandi WargaKu"
# content_path = "./supabase/templates/recovery.html"

[storage]
enabled = true
file_size_limit = "10MiB"

[storage.vector]
enabled = false
